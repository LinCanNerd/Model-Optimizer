# End-to-end DFlash reference run for Qwen3-8B: train -> serve -> benchmark.
#
# One YAML that produces every artifact a handover needs: a trained drafter, an
# exported checkpoint, a vLLM serving invocation, and a measured acceptance length.
# hf_online_dflash.yaml is the same pipeline against a pre-staged 100K sample; this
# one trains from the full Spec-Decoding-Dataset-v2 with a bounded step count, so it
# runs on one node in about an hour instead of needing a dataset staged first.
#
# 3-step pipeline:
#   task_0: Online DFlash training + export (8 GPU)
#   task_1: vLLM smoke test with DFlash speculative decoding (1 GPU)
#   task_2: MT-Bench per-category HF AR evaluation (1 GPU)
#
# Convergence reference from hf_online_dflash.yaml (8x B200, bs=1, seq_len=4096,
# 5-layer draft, block_size=16), for reading the loss curve mid-run:
#   Step  2500: loss=4.981  acc=0.138
#   Step  5000: loss=4.383  acc=0.176
#   Step  7500: loss=4.040  acc=0.196
# max_steps below is set past the point where the MIN_FINAL_ACC gate is reachable.
#
# Reference: "DFlash: Block Diffusion for Flash Speculative Decoding" (arXiv:2602.06036)
#
# Usage:
#   uv run launch.py --yaml examples/Qwen/Qwen3-8B/hf_online_dflash_e2e.yaml --yes

job_name: Qwen3-8B_DFlash_online_e2e
pipeline:
  global_vars:
    hf_model: /hf-local/Qwen/Qwen3-8B

  # Step 1: Online DFlash training. The script exports the drafter at the end.
  #
  # data_path is the full v2 corpus (5.5 GB, OpenAI message format) rather than a
  # pre-sampled slice, so the run needs nothing staged beforehand; max_steps is what
  # bounds it. Raise max_steps (or drop it and set num_train_epochs) for a real run.
  task_0:
    script: common/specdec/dflash_online_training.sh
    args:
      - --config modules/Model-Optimizer/modelopt_recipes/general/speculative_decoding/dflash.yaml
      - model.model_name_or_path=<<global_vars.hf_model>>
      - data.data_path=/hf-local/modelopt/Speculative-Decoding-Dataset-v2-default/default.jsonl
      - data.chat_template=examples/Qwen/Qwen3-8B/chat_template_train.jinja
      - training.output_dir=/scratchspace/dflash_bs16_e2e
      - training.per_device_train_batch_size=1
      - training.num_train_epochs=1
      - training.max_steps=6000
      - training.training_seq_len=4096
      - training.save_steps=3000
      - training.logging_steps=100
      - training.disable_tqdm=true
      - training.answer_only_loss=true
      - dflash.dflash_block_size=16
      - dflash.dflash_num_anchors=512
      - dflash.dflash_loss_decay_factor=7
      - dflash.dflash_mask_token_id=151669
      - dflash.dflash_architecture_config.num_hidden_layers=5
    environment:
      - MAX_FINAL_LOSS: "5.0"
      - MIN_FINAL_ACC: "0.15"
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 8

  # Step 2: vLLM smoke test against the exported drafter. This is the serving path —
  # the script builds the `vllm serve` invocation with the speculative config.
  task_1:
    script: common/specdec/vllm_smoke_test.sh
    environment:
      - HF_MODEL_CKPT: <<global_vars.hf_model>>
      - DRAFT_CKPT_DIR: /scratchspace/dflash_bs16_e2e
      - SPEC_METHOD: "dflash"
      - NUM_SPEC_TOKENS: "7"
      - MIN_ACCEPTANCE_LENGTH: "1.4"
    slurm_config:
      _factory_: "slurm_factory"
      container: "vllm/vllm-openai:nightly"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1

  # Step 3: MT-Bench per-category acceptance rate, the number to quote.
  task_2:
    script: common/specdec/ar_eval_mtbench.sh
    args:
      - --ckpt_dir /scratchspace/dflash_bs16_e2e
      - --osl 512
      - --steps 15
    slurm_config:
      _factory_: "slurm_factory"
      nodes: 1
      ntasks_per_node: 1
      gpus_per_node: 1
